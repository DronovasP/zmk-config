# Cosmos: wired split, USB only. No battery, no radio.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SLEEP=n

# ZMK Studio: don't require pressing &studio_unlock before editing.
# (Studio itself is enabled per-build via build.yaml on the left half only.)
CONFIG_ZMK_STUDIO_LOCKING=n

# Wired split UART mode. ZMK v0.3 defaults to async/DMA mode on nRF52, which has
# a buffer-size bug (RX buffer dimensions swapped, fixed on main in Jan 2026 but
# not in v0.3) that corrupts memory and crash-loops both halves. Interrupt mode
# avoids it - and ZMK's own Kconfig notes async is not meant for nRF52 yet.
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
