# GitHub Actions build matrix. Artifacts land in the "firmware" zip of each run.
---
include:
  # ---- Cosmos 5x6, handwired, wired split, nice!nano v2 ----
  # Left = central (USB to PC) and the only half that carries ZMK Studio.
  - board: nice_nano_v2
    shield: cosmos_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: cosmos_left
  - board: nice_nano_v2
    shield: cosmos_right
    artifact-name: cosmos_right

  # Flash this to wipe stored settings/keymap on a half if Studio edits go wrong.
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset

  # ---- Cradio / Ferris Sweep (old board, BLE split) ----
  # Both "right central" (_rc) and "left central" (_lc) variants are built.
  - board: nice_nano_v2
    shield: cradio_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: cradio_left_rc
  - board: nice_nano_v2
    shield: cradio_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: cradio_right_rc
  - board: nice_nano_v2
    shield: cradio_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: cradio_left_lc
  - board: nice_nano_v2
    shield: cradio_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: cradio_right_lc
